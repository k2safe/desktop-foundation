name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: false
        default: ""
      channel:
        description: "Update channel"
        required: false
        default: "stable"
      github_repo:
        description: "GitHub release repository, owner/repo. Defaults to this repository."
        required: false
        default: ""
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec desktop-foundation-ci --type-check --build --strict

  package-macos:
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Normalize desktop artifacts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_REPO: ${{ inputs.github_repo || github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          args=(
            --no-type-check
            --no-build
            --package-desktop
            --manifest
            --release-plan
            --channel "$RELEASE_CHANNEL"
            --github-repo "$RELEASE_REPO"
          )
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          pnpm exec desktop-foundation-ci "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: artifacts/desktop
