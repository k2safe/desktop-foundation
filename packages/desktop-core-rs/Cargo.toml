[package]
name = "desktop-core-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "desktop-core"
build = "build.rs"

[lib]
name = "desktop_core_rs"
path = "src/lib.rs"

[features]
default = []
http-reqwest = ["dep:reqwest"]
tauri = ["dep:tauri"]

[dependencies]
base64 = "0.22"
dirs = "6"
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["blocking", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", optional = true, features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
